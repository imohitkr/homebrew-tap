name: Update cask

# Checks the latest ColimaBar release every hour. The release job of
# colima-bar also starts this workflow right after it publishes a release.
# If the release is newer than the cask, this workflow verifies the release
# zip and commits the new version, the sha256 and the minimum macOS (from the
# "Requires macOS X or later." line of the release notes) to main. Then it
# starts the Test workflow, because a push with GITHUB_TOKEN does not start
# other workflows.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: update-cask
  cancel-in-progress: false

permissions:
  contents: read

# Actions are pinned to full commit SHAs, so a moved tag cannot change them.
#
# Two jobs keep the write token away from the release download:
# - verify has a read-only token. It compares the versions, downloads
#   ColimaBar.zip and verifies its attestation. It outputs the version and
#   the sha256.
# - update runs only after verify succeeds. It has the write token. It
#   edits the cask, pushes to main and starts the Test workflow.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CASK: Casks/colima-bar.rb
      UPSTREAM: imohitkr/colima-bar
    outputs:
      update: ${{ steps.check.outputs.update }}
      version: ${{ steps.check.outputs.version }}
      macos: ${{ steps.check.outputs.macos }}
      sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Compare versions
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName)
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The latest release has an unexpected tag: $tag"
            exit 1
          fi
          latest=${tag#v}
          current=$(sed -n 's/^  version "\([0-9.]*\)"$/\1/p' "$CASK")
          if [ -z "$current" ]; then
            echo "::error::Cannot read the version from $CASK"
            exit 1
          fi
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)
          if [ "$latest" = "$current" ] || [ "$newest" != "$latest" ]; then
            echo "The cask has $current. The latest release is $latest. No update."
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The release notes name the macOS that the build needs. Homebrew
          # names macOS versions; a new major version needs a line here. No
          # line keeps the cask's depends_on macos as it is.
          body=$(gh release view "$tag" --repo "$UPSTREAM" --json body --jq .body)
          macos=""
          if [[ "$body" =~ Requires\ macOS\ ([0-9]+)(\.[0-9]+){0,2}\ or\ later ]]; then
            case "${BASH_REMATCH[1]}" in
              14) macos=sonoma ;;
              15) macos=sequoia ;;
              26) macos=tahoe ;;
              *)
                echo "::error::No Homebrew name for macOS ${BASH_REMATCH[1]}"
                exit 1
                ;;
            esac
          fi
          echo "Update $current -> $latest (macOS: ${macos:-unchanged})"
          {
            echo "update=true"
            echo "tag=$tag"
            echo "version=$latest"
            echo "macos=$macos"
          } >> "$GITHUB_OUTPUT"

      # The attestation proves that the release job of ci.yml built the zip
      # from the release tag on a GitHub-hosted runner.
      - name: Download and verify ColimaBar.zip
        id: verify
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          gh release download "$TAG" --repo "$UPSTREAM" --pattern ColimaBar.zip --dir "$dir"
          gh attestation verify "$dir/ColimaBar.zip" \
            --repo "$UPSTREAM" \
            --signer-workflow "$UPSTREAM/.github/workflows/ci.yml" \
            --source-ref "refs/tags/$TAG" \
            --deny-self-hosted-runners
          sha=$(sha256sum "$dir/ColimaBar.zip" | cut -d ' ' -f 1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

  update:
    needs: verify
    if: needs.verify.outputs.update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push the cask update to main
      actions: write    # start the Test workflow
    env:
      CASK: Casks/colima-bar.rb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # This step gets no token. It checks the outputs of verify again,
      # because they cross a job boundary. It also compares the versions
      # again, because main can change after verify ran.
      - name: Update the cask
        id: edit
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          SHA256: ${{ needs.verify.outputs.sha256 }}
          MACOS: ${{ needs.verify.outputs.macos }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected version: $VERSION"
            exit 1
          fi
          if [[ ! "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected sha256: $SHA256"
            exit 1
          fi
          if [[ ! "$MACOS" =~ ^(sonoma|sequoia|tahoe)?$ ]]; then
            echo "::error::Unexpected macOS: $MACOS"
            exit 1
          fi
          current=$(sed -n 's/^  version "\([0-9.]*\)"$/\1/p' "$CASK")
          if [ -z "$current" ]; then
            echo "::error::Cannot read the version from $CASK"
            exit 1
          fi
          newest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)
          if [ "$VERSION" = "$current" ] || [ "$newest" != "$VERSION" ]; then
            echo "::notice::The cask on main has $current. It is not older than $VERSION. No update."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i \
            -e "s/^  version \"[0-9.]*\"$/  version \"$VERSION\"/" \
            -e "s/^  sha256 \"[0-9a-f]*\"$/  sha256 \"$SHA256\"/" \
            "$CASK"
          grep -qx "  version \"$VERSION\"" "$CASK"
          grep -qx "  sha256 \"$SHA256\"" "$CASK"
          if [ -n "$MACOS" ]; then
            sed -i "s/^  depends_on macos: :[a-z]*$/  depends_on macos: :$MACOS/" "$CASK"
            grep -qx "  depends_on macos: :$MACOS" "$CASK"
          fi
          git diff
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # It pushes with the token of this run.
      - name: Commit and push
        if: steps.edit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update colima-bar to $VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Start the Test workflow
        if: steps.edit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref main
